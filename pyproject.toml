[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlib-quant"
version = "0.1.0"
description = "Daily quantitative research and trading decision support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Yanzhuang" }]
dependencies = [
    "duckdb>=1.4,<2",
    "exchange-calendars>=4.13,<5",
    "lightgbm>=4.5,<5",
    "pandas>=2.2,<4",
    "pyarrow>=19,<24",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "streamlit>=1.38,<2",
    "typer>=0.15,<1",
    "yfinance>=1.2,<2",
]

[project.scripts]
quant = "quant_system.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_system"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
