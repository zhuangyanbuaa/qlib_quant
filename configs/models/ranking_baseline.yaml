dataset:
  holding_sessions: [5]
  feature_columns:
    - drawdown_from_high20
    - rsi14
    - atr20
    - adx14
    - avg_dollar_volume20
    - relative_return60
    - ma50_slope20
walk_forward:
  train_sessions: 504
  validation_sessions: 63
  step_sessions: 63
  hold_period: 5
  feature_lookback_days: 200
  minimum_train_rows: 30
  minimum_validation_rows: 5
ridge:
  alpha: 10.0
  top_fraction: 0.2
lightgbm:
  n_estimators: 50
  learning_rate: 0.03
  num_leaves: 7
  max_depth: 3
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 10.0
  random_state: 42
  n_jobs: 1
  top_fraction: 0.2
  minimum_train_rows: 30
calibration:
  buckets: 5
