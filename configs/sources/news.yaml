alpha_vantage:
  enabled: true
  calls_per_minute: 5
  daily_call_budget: 25
  timeout_seconds: 20
  batch_size: 10
  limit_per_call: 50
  topics:
    - technology
    - earnings
    - financial_markets
  retry:
    attempts: 3
    initial_backoff_seconds: 1
    maximum_backoff_seconds: 8
    jitter_seconds: 0.25

sec:
  enabled: true
  calls_per_second: 5
  daily_call_budget: 200
  timeout_seconds: 20
  forms:
    - 8-K
    - 10-Q
    - 10-K
    - S-1
    - S-3
    - 424B5
  retry:
    attempts: 3
    initial_backoff_seconds: 1
    maximum_backoff_seconds: 8
    jitter_seconds: 0.25

sentiment:
  scorer: rule_based
  finbert:
    model_name: ProsusAI/finbert
    model_revision: main
    device: auto
    batch_size: 16
    max_articles_per_run: 500
    inference_timeout_seconds: 20
    cache_enabled: true

risk:
  lookback_hours: 72
  high_severity_veto: true

