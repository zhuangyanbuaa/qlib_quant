universe_type: LEVERAGE_OVERLAY
description: Manual-only 2x long product overlay universe. This is a subsidiary
  tactical radar and must not be merged into the main Buy-the-Dip strategy.
selection_policy:
  start_date_rule: Every mapping starts no earlier than the overlay selection date.
  market_proxy: QQQ
  use_case: Manual review of occasional 2x long expression after the underlying,
    market, sector, stop, risk/reward, and catalyst gates are satisfied.
  hard_boundary: This universe does not authorize automatic orders and does not
    modify main-strategy candidates.
  source_basis:
  - Selected only when the underlying already exists in the repository watchlists
    or benchmark layer.
  - Product availability was cross-checked with issuer/product metadata and
    recent quote availability on 2026-08-09; revalidate before live use because
    single-stock leveraged products can change quickly.
  - Direxion leveraged single-stock products are used where they are the clearest
    canonical mapping for this watchlist.
  - GraniteShares and T-Rex alternatives are listed for manual comparison when
    common alternatives exist.
